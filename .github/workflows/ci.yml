# The gate on every pull request and every push to main: scripts/task check, the same
# verbs the hooks and a laptop run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes its older run moot. Pushes to main are never
# cancelled: each merged commit gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The cairn release the backlog's format was written with, and its tarball's
      # hash, held here rather than read from the same release it would vouch for.
      CAIRN_VERSION: 1.0.0-alpha.1
      CAIRN_SHA256: 751e02c386b22ad287c8120d51204815349669e239909b53c92cf1e552d10337
    steps:
      # Actions are pinned by commit: a tag can be moved to run other code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm's version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright's browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # System libraries aren't cached, so this runs either way; a cache hit skips the download.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Install cairn
        run: |
          set -eu
          name="cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/oddurs/cairn/releases/download/v${CAIRN_VERSION}/${name}.tar.gz"
          echo "${CAIRN_SHA256}  ${name}.tar.gz" | sha256sum --check --strict -
          tar -xzf "${name}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "${name}/cairn" "$HOME/.local/bin/cairn"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Starts Postgres through docker-compose.yml, as on a laptop.
      - run: scripts/task check

  # The single status check branch protection requires, so adding a job never means
  # editing the protection rule.
  required:
    if: always()
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.check.result }}" = success
