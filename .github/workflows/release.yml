name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CAIRN_VERSION: 1.0.0-alpha.1
      CAIRN_SHA256: 751e02c386b22ad287c8120d51204815349669e239909b53c92cf1e552d10337
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install cairn
        run: |
          set -eu
          name="cairn-${CAIRN_VERSION}-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/oddurs/cairn/releases/download/v${CAIRN_VERSION}/${name}.tar.gz"
          echo "${CAIRN_SHA256}  ${name}.tar.gz" | sha256sum --check --strict -
          tar -xzf "${name}.tar.gz"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "${name}/cairn" "$HOME/.local/bin/cairn"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/task check
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
