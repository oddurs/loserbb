name: Feature request
description: Suggest something loserbb should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine loserbb solving it. Check ROADMAP.md first; it may already be planned.
    validations:
      required: true
